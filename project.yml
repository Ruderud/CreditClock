name: CreditClock
options:
  minimumXcodeGenVersion: 2.39.0
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
schemes:
  CreditClock:
    build:
      targets:
        CreditClock: all
        CreditClockWidgetExtension: all
    run:
      config: Debug
    profile:
      config: Release
  CreditClockWidgetExtension:
    build:
      targets:
        CreditClockWidgetExtension: all
    run:
      config: Debug

targets:
  CreditClock:
    type: application
    platform: macOS
    sources:
      - path: CreditClockApp
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.creditclock.app
      PRODUCT_NAME: CreditClock
      SWIFT_VERSION: 5.10
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: CreditClock
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: CreditClockApp/CreditClock.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - group.com.creditclock.shared
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - .claude/
          - .codex/
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - .creditclock/
          - Library/Containers/com.creditclock.app.widget/
    dependencies:
      - target: CreditClockWidgetExtension

  CreditClockWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CreditClockWidget
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: CreditClockWidget/Info.plist
      properties:
        CFBundleDisplayName: CreditClock Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.creditclock.app.widget
      PRODUCT_NAME: CreditClockWidget
      SWIFT_VERSION: 5.10
      CODE_SIGN_STYLE: Automatic
      APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: CreditClockWidget/CreditClockWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.creditclock.shared
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - .creditclock/
